<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>V20 Screener — Daily Buy Zone</title>
<style>
  :root{
    --bg:#000000; --card:#0a0f0a; --line:#1a3d1a;
    --neon:#39FF14; --text:#c9f7c9; --text-dim:#5a8a5a;
    --skip:#ff4444; --unclear:#666;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px;}
  h1{font-family:'Courier New',monospace;font-weight:700;font-size:24px;margin-bottom:2px;letter-spacing:1px;color:var(--neon);}
  .updated{color:var(--text-dim);font-size:12px;margin-bottom:30px;font-family:'Courier New',monospace;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--neon);border-bottom:1px solid var(--line);
    padding:8px 10px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    font-family:'Courier New',monospace;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);font-family:'Courier New',monospace;}
  tr:hover td{background:var(--card);}
  .status{font-size:11px;padding:3px 8px;border-radius:2px;white-space:nowrap;font-weight:700;}
  .status.zone{background:rgba(57,255,20,0.15);color:var(--neon);}
  .status.past{background:rgba(255,68,68,0.15);color:var(--skip);}
  .status.between{background:rgba(102,102,102,0.15);color:var(--unclear);}
  .empty{color:var(--text-dim);font-style:italic;padding:30px 0;font-family:'Courier New',monospace;}
  .ticker{color:var(--neon);font-weight:700;}
  .footer{color:#3a5a3a;font-size:11px;margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>V20 SCREENER · DAILY BUY ZONE</h1>
  <div class="updated" id="updated">Loading...</div>
  <div id="content"><div class="empty">Loading data...</div></div>
  <p class="footer">Facts-based screen only. Not a buy/sell recommendation.</p>
</div>

<script>
// This dashboard reads buy_zone_candidates.csv from THIS SAME repo
// (v20-dashboard). The private ai-build-2026 repo's daily workflow
// pushes a fresh copy here every morning - see the "Sync to dashboard"
// step in that repo's .github/workflows/v20-daily.yml
const CSV_URL = "buy_zone_candidates.csv";

function parseCSV(text){
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(line => {
    const vals = line.split(",");
    const row = {};
    headers.forEach((h, i) => row[h.trim()] = (vals[i] || "").trim());
    return row;
  });
}

function statusClass(status){
  if(status === "IN_BUY_ZONE") return "zone";
  if(status === "ALREADY_RAN_PAST_HIGH") return "past";
  return "between";
}

async function load(){
  try{
    const res = await fetch(CSV_URL + "?t=" + Date.now());
    if(!res.ok) throw new Error("CSV not found yet - first sync may not have run");
    const text = await res.text();
    const rows = parseCSV(text);
    document.getElementById("updated").textContent = "Last updated: " + new Date().toLocaleString();

    if(rows.length === 0){
      document.getElementById("content").innerHTML = '<div class="empty">No candidates today.</div>';
      return;
    }

    const inZone = rows.filter(r => r.status === "IN_BUY_ZONE");
    const rest = rows.filter(r => r.status !== "IN_BUY_ZONE");
    const ordered = [...inZone, ...rest];

    let html = '<table><tr><th>Ticker</th><th>Run</th><th>Move</th><th>Current</th><th>Range</th><th>Status</th></tr>';
    ordered.forEach(r => {
      html += `<tr>
        <td class="ticker">${r.ticker}</td>
        <td>${r.start_date} → ${r.end_date}</td>
        <td>${r.pct_move}%</td>
        <td>$${r.current_price}</td>
        <td>$${r.range_low} - $${r.range_high}</td>
        <td><span class="status ${statusClass(r.status)}">${r.status.replace(/_/g," ")}</span></td>
      </tr>`;
    });
    html += "</table>";
    document.getElementById("content").innerHTML = html;
  }catch(e){
    document.getElementById("content").innerHTML = '<div class="empty">Could not load data: ' + e.message + '</div>';
  }
}
load();
</script>
</body>
</html>
